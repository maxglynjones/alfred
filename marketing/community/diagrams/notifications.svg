<text x="60" y="725" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">“Show my reminders”</text>
<text x="60" y="747" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">Readable foreground response</text>
<rect x="910" y="640" width="330" height="130" rx="12" fill="#101d15" stroke="#3a6247"/>
<text x="930" y="667" fill="#8ae3a2" font-family="Arial, sans-serif" font-size="11">OWNER-CONFIRMED PATH</text>
<text x="930" y="698" fill="#e2f3e7" font-family="Arial, sans-serif" font-size="21">HA iPhone app</text>
<text x="930" y="725" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">Notification appears if allowed</text>
<text x="930" y="747" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">Network / Focus can affect it</text>
<polyline points="475,480 420,480 420,705 370,705" fill="none" stroke="#8ae3a2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="429" y="593" fill="#8ae3a2" font-family="Arial, sans-serif" font-size="12">paired read</text>
<polyline points="1075,545 1075,640" fill="none" stroke="#8ae3a2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40" y="367" fill="#a5b8ab" font-family="Arial, sans-serif" font-size="15">The scheduler survives closing the glasses plugin; the plugin itself is not always running.</text>
<text x="40" y="788" fill="#9ab4a2" font-family="Arial, sans-serif" font-size="13">Inbox presence ≠ push receipt. No general reading of other apps’ iOS notifications is implemented.</text>
</svg>