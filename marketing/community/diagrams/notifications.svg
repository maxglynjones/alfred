<text x="495" y="442" fill="#8ae3a2" font-family="Arial, sans-serif" font-size="11">HA STORE</text>
<text x="495" y="473" fill="#e2f3e7" font-family="Arial, sans-serif" font-size="21">Reminder inbox</text>
<text x="495" y="500" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">Stored due items / status</text>
<text x="495" y="522" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">Read when Alfred is active</text>
<rect x="910" y="415" width="330" height="130" rx="12" fill="#101d15" stroke="#3a6247"/>
<text x="930" y="442" fill="#8ae3a2" font-family="Arial, sans-serif" font-size="11">EXTERNAL TRANSPORT</text>
<text x="930" y="473" fill="#e2f3e7" font-family="Arial, sans-serif" font-size="21">Remote push delivery</text>
<text x="930" y="500" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">HA / OS push infrastructure</text>
<text x="930" y="522" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">Separate from home VPN path</text>
<polyline points="640,300 640,415" fill="none" stroke="#8ae3a2" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="1075,300 1075,415" fill="none" stroke="#8ae3a2" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40" y="640" width="330" height="130" rx="12" fill="#101d15" stroke="#3a6247"/>
<text x="60" y="667" fill="#8ae3a2" font-family="Arial, sans-serif" font-size="11">ON REQUEST</text>
