<text x="490" y="289" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">No author-operated backend</text>
<rect x="930" y="160" width="310" height="170" rx="12" fill="#101d15" stroke="#3a6247"/>
<text x="950" y="187" fill="#8ae3a2" font-family="Arial, sans-serif" font-size="11">COMPLETE</text>
