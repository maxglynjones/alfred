<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc"><title id="title">Less screen. More done.</title><desc id="desc">An independently hosted assistant that complements the Even experience</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#183023" stroke-width="0.5"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8ae3a2" stroke-width="1.2"/></marker></defs><rect width="1280" height="800" fill="#07100b"/><rect width="1280" height="800" fill="url(#grid)" opacity="0.45"/>
<text x="40" y="38" fill="#8ae3a2" font-family="Arial, sans-serif" font-size="14">alfred / architecture</text>
<text x="40" y="84" fill="#e2f3e7" font-family="Arial, sans-serif" font-size="32">Less screen. More done.</text>
<text x="40" y="113" fill="#a5b8ab" font-family="Arial, sans-serif" font-size="15">An independently hosted assistant that complements the Even experience</text>
