<polyline points="645,330 645,445" fill="none" stroke="#8ae3a2" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="775,330 775,390 1085,390 1085,445" fill="none" stroke="#8ae3a2" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="40" y="687" fill="#8ae3a2" font-family="Arial, sans-serif" font-size="21">Open-source Alfred • independent installations • stock Even firmware</text>
<text x="40" y="723" fill="#a5b8ab" font-family="Arial, sans-serif" font-size="15">Self-hosting does not mean every optional recogniser, integration or push route is entirely local.</text>
<text x="40" y="768" fill="#9ab4a2" font-family="Arial, sans-serif" font-size="13">Current install: configure your HTTPS origin → generate your own Even package → pair to your HA.</text>
