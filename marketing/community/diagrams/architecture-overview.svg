<text x="60" y="267" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">Short reply or verified action tick</text>
<text x="60" y="289" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">Return to a passive display</text>
