<text x="950" y="530" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">Durable scheduling in HA</text>
<text x="950" y="552" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">Existing HA Companion push</text>
<text x="950" y="574" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">No new native Alfred app</text>
