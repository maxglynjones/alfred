<text x="490" y="472" fill="#8ae3a2" font-family="Arial, sans-serif" font-size="11">EXTEND</text>
<text x="490" y="503" fill="#e2f3e7" font-family="Arial, sans-serif" font-size="21">Your chosen services</text>
<text x="490" y="530" fill="#bbcec1" font-family="Arial, sans-serif" font-size="14">Speech / AI / mail / calendar</text>
