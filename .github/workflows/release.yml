name: Generic self-hosted release assets
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: npm install --global pnpm@10.18.3
      - run: pnpm install --frozen-lockfile
      - name: Require tag to match source version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; if(process.env.RELEASE_TAG.replace(/^v/, "") !== JSON.parse(fs.readFileSync("package.json")).version) process.exit(1)'
      - run: python -m pip install -r requirements-dev.txt
      - run: pnpm test && pnpm pack:ha && pnpm check:public
      - run: python -B tests/ha-native-runtime.py && python -B tests/ha-reminder-engine.py
      - name: Attach generic installer and source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git archive --format=zip --output=alfred-source.zip HEAD
          gh release upload "$RELEASE_TAG" integrations/home-assistant/alfred-ha.zip alfred-source.zip --clobber
